# Evita que Supabase (plan gratuito) pause el proyecto por inactividad:
# una consulta ligera cada día mantiene la base de datos activa.
name: Mantener Supabase activo

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta ligera a la base de datos
        env:
          # Clave pública (la misma que usa el navegador); no es un secreto.
          SUPABASE_URL: https://fomdxwpxydxtqkbjtozl.supabase.co
          SUPABASE_KEY: sb_publishable_AXrAZfEip3gTbP1BjidbNw_XSzPfNRH
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 20 \
            -H "apikey: $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/shop_items?select=id&limit=1"
